# Limit Watchdog – configuration
# Changes take effect with the next tick (every minute). Check with: ./waechter.py status
# Personal overrides go into config.local.toml next to this file (ignored by git), e.g.:
#   [allgemein]
#   sprache = "de"
#   name = "Alex"

[allgemein]                            # general
sprache = "en"                         # language of notifications, CLI output and hook texts: "en" | "de"
name = ""                              # optional: your name, used in the texts the hooks show to Claude
launchagent_label = "local.limit-waechter"
nur_orca = false                       # true: only watch sessions in Orca terminals (behaviour up to 1.2);
                                       # false: also normal terminals and desktop apps where hooks reach them

[schwellen]                            # thresholds
warnung = 80           # % of the 5-hour window: notification
stopp = 92             # % of the 5-hour window: stop threshold (Claude: see claude_stopp_art; Codex: orderly stop)
woche_warnung = 80     # % of the weekly window
woche_stopp = 92       # % of the weekly window
wochen_reserve = 20    # weekly reserve: above 100 - 20 = 80 % weekly use there is no automatic continuation
claude_stopp_art = "sanft"   # since 1.4. "sanft" (soft): at the 5-hour stop Claude only gets no new subagents/workflows
                       # and one short note, then Claude's own limit handling takes over (built-in auto-continue);
                       # "geordnet" (orderly): checkpoint request and pause as up to 1.3.
                       # The weekly stop and the weekly reserve are always orderly.

[fortsetzen]                           # continuing after the reset
aktiv = true
nur_mit_nachtmodus = true              # the watchdog itself continues only sessions in night mode (Codex, and Claude
                                       # when its built-in auto-continue does not work); since 1.4 Claude's built-in
                                       # auto-continue is never blocked (only by the weekly reserve, see below)
puffer_minuten = 2                     # wait this long after resets_at
max_pro_fenster = 2                    # at most 2 automatic continuations per session and window
pro_tick = 2                           # staggered: at most 2 continuations per minute
claude_limit_resume = "waechter"       # "waechter" or "orca" (if Orca's own rate-limit watcher handles Claude)
claude_eingebaut_karenz_minuten = 5    # give Claude Code's built-in auto-continue this head start
reserve_sperrt_eingebaute_fortsetzung = true   # the weekly reserve also blocks Claude's built-in auto-continue
claude_befehl = ""                     # path to claude (empty = find automatically)
claude_modus = "auto"                  # permission mode for sessions restarted with --resume
codex_befehl = ""                      # path to codex (empty = find automatically)
codex_sandbox = "workspace-write"
codex_stopp_senden = true              # in the stop phase, send a short message to working Codex terminals
codex_queue = false                    # experimental, not verified yet: Codex outside Orca gets the stop message and
                                       # the continuation via `codex queue` (text only); false = only warn and notify
pruefen_nach_minuten = 2               # check a few minutes later whether the continuation got stuck
belege_pruefen = true                  # trust Orca's "working" only with evidence (screen, transcript, rollout);
                                       # a "running already" without evidence is re-checked after pruefen_nach_minuten
aktiv_frist_minuten = 10               # a transcript/rollout entry younger than this counts as a running turn
max_nachpruefungen = 3                 # per session and window: "running already" without activity -> back to
                                       # waiting and try again; after that many re-checks: blocked + notification

[daten]                                # data sources
orca = "/Applications/Orca.app/Contents/Resources/bin/orca"
codex_sessions = "~/.codex/sessions"
orca_hook_status = "~/Library/Application Support/orca/agent-hooks/last-status.json"
max_alter_minuten = 30                 # older usage data is shown as stale
hook_zustand_max_alter_minuten = 10    # if the state is older (watchdog not running), the hooks do nothing
# official usage (same numbers as Claude Desktop / ChatGPT; read-only request, no model call;
# the login token is read at runtime and never stored or logged). Since 1.4.
offiziell = true                       # fetch the official usage; false = only Orca / status line / Codex log
offiziell_intervall_minuten = 3        # how often to fetch
offiziell_intervall_eng_minuten = 1    # during warning/stop/limit or when a continuation is due soon
offiziell_max_alter_minuten = 10       # younger official data always wins over the other sources
offiziell_timeout_sekunden = 8
claude_usage_url = "https://api.anthropic.com/api/oauth/usage"
codex_usage_url = "https://chatgpt.com/backend-api/wham/usage"
claude_schluesselbund_dienst = "Claude Code-credentials"   # keychain item Claude Code created (read only)
codex_auth = "~/.codex/auth.json"      # Codex login file (read only)
frueh_reset_abfall = 20                # percentage points: a drop this large before the reset counts as an early reset

[kontext]                              # context window per session (since 1.4)
warnung = 70                           # % of the model's context window: notification (and status line colour)
kritisch = 85
melden = true                          # push + banner once per session and level
hinweis_an_sitzung = false             # true: Claude also gets one short note per level ("prepare a handoff")
standard_fenster = 200000              # context window if neither Claude nor the model name says (e.g. [1m] = 1M)

[statusline]                           # own line below your status line in Claude Code (since 1.4)
anzeigen = true                        # model · context bar · 5 h · week · night; false = only your status line

[anzeige]                              # display in status and the app (since 1.4)
ruht_stunden = 12                      # idle sessions are only listed if seen within this many hours

[melden]                               # notifications
ntfy = true
ntfy_server = "https://ntfy.sh"
ntfy_dienst = "limit-waechter-ntfy"    # name of the macOS keychain item (the topic itself is only stored there)
banner = true                          # macOS notification banner

[wach]                                 # keeping the Mac awake
caffeinate = true                      # caffeinate -i -s until reset + grace time while a continuation is pending
nachlauf_minuten = 15
max_stunden_voraus = 12                # only keep awake for continuations within the next 12 hours
remote_modus_pruefen = true            # at night, warn if the Mac would sleep with the lid closed or runs on battery
remote_modus_befehl = ""               # command shown in that warning; empty (or its script is gone) = "waechter.py awake on"
# since 1.4: awake mode (waechter.py awake on|off|status) and automatic keep-awake
amphetamine = true                     # use Amphetamine if installed (otherwise caffeinate only, which needs power)
amphetamine_zugeklappt = true          # own Amphetamine sessions keep the Mac awake with the lid closed
bei_nachtmodus = true                  # keep the Mac awake automatically while night mode is on (no password)
sperre_standard = 300                  # screen lock delay in seconds restored by "awake off" if none was saved
remote_alt_zustand = ""                # optional: state file of an older keep-awake script, read once (never changed);
                                       # empty = ".vorherige-sperre" next to the script in remote_modus_befehl

[bericht]                              # morning report
uhrzeit = "08:00"                      # only sent if something happened overnight; night mode ends at this time
