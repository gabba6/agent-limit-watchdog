name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: /usr/bin/python3 --version
      - name: Unit tests (no network, no model calls)
        run: cd tests && /usr/bin/python3 -m unittest -v
      - name: Full simulated cycle
        run: ./waechter.py simulate cycle
